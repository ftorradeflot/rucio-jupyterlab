# ./nginx/nginx.conf (on your host machine)

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_header_buffer_size 128k;
    large_client_header_buffers 4 128k;

    map $http_upgrade $proxy_connection {
        default upgrade;
        '' $proxy_connection_noupgrade;
    }

    map $upstream_keepalive $proxy_connection_noupgrade {
        # Preserve nginx's default behavior (send "Connection: close").
        default close;
        # Use an empty string to cancel nginx's default behavior.
        true '';
    }

    # Abuse the map directive (see <https://stackoverflow.com/q/14433309>) to ensure
    # that $upstream_keepalive is always defined.
    map "" $upstream_keepalive {
        default false;
    }

    # Standard proxy headers (borrowed from jwilder's config)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $proxy_connection;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Ssl $ssl_protocol; # Use $ssl_protocol to indicate HTTPS
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Proxy ""; # Mitigate httpoxy attack

    # Define upstream servers (your Docker containers)
    upstream keycloak_backend {
        server keycloak:8443; # Use container name and internal port
        keepalive 2;
    }

    upstream indigoiam_backend {
        server indigoiam:443; # Assuming it listens on 443 internally
        keepalive 2;
    }

    upstream rucio_backend {
        server rucio:443; # Assuming it listens on 443 internally
        keepalive 2;
    }

    # Server Block for Keycloak
    server {
        listen 80;  # Listen for HTTP on port 80
        listen 8443 ssl; # Listen for HTTPS on port 443

        server_name keycloak; # Your desired hostname

        # SSL Certificates for the client-facing connection
        ssl_certificate /etc/nginx/certs/keycloak.crt;
        ssl_certificate_key /etc/nginx/certs/keycloak.key;

        # Common SSL settings (from jwilder's config)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_dhparam /etc/nginx/dhparam/dhparam.pem; # You'll need to generate this

        location / {
            # Proxy to Keycloak using HTTPS because Keycloak provides its own certificate
            proxy_pass https://keycloak:8443; # <--- Use HTTPS for backend

            # Crucial for self-signed or untrusted backend certificates
            proxy_ssl_verify off; # <--- Disable verification for local dev
        }

        # Optional: Redirect HTTP to HTTPS
        # if ($scheme = http) {
        #     return 301 https://$host$request_uri;
        # }
    }

    # Server Block for IndigoIAM
    server {
        listen 80;  # Listen for HTTP on port 80
        listen 443 ssl; # Listen for HTTPS on port 443

        server_name indigoiam; # Your desired hostname

        # SSL Certificates for the client-facing connection
        ssl_certificate /etc/nginx/certs/indigoiam.pem;
        ssl_certificate_key /etc/nginx/certs/indigoiam.key;

        # Common SSL settings (from jwilder's config)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_dhparam /etc/nginx/dhparam/dhparam.pem; # You'll need to generate this

        location / {
            # Proxy to Keycloak using HTTPS because Keycloak provides its own certificate
            proxy_pass https://indigoiam:443; # <--- Use HTTPS for backend

            # Crucial for self-signed or untrusted backend certificates
            proxy_ssl_verify off; # <--- Disable verification for local dev
        }
    }

    # Server Block for Rucio
    server {
        listen 80;  # Listen for HTTP on port 80
        listen 443 ssl; # Listen for HTTPS on port 443

        server_name rucio; # Your desired hostname

        # SSL Certificates for the client-facing connection
        ssl_certificate /etc/nginx/certs/rucio.pem;
        ssl_certificate_key /etc/nginx/certs/rucio.key;

        # Common SSL settings (from jwilder's config)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_dhparam /etc/nginx/dhparam/dhparam.pem; # You'll need to generate this

        location / {
            # Proxy to Keycloak using HTTPS because Keycloak provides its own certificate
            proxy_pass https://rucio:443; # <--- Use HTTPS for backend

            # Crucial for self-signed or untrusted backend certificates
            proxy_ssl_verify off; # <--- Disable verification for local dev
        }
    }
}